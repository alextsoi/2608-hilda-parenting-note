  <text x="592" y="484" dy="9" fill="#1c2a3a" font-size="24">• 安撫後再餵</text>
  <rect y="716" width="1080" height="64" fill="#0b5e60"/>
  <text x="48" y="748" dy="6" fill="#d2e8e4" font-size="18">衞生署家庭健康服務網頁文字摘要　·　唔構成醫療建議</text>
