  <text x="48" y="70" dy="15" fill="#ffffff" font-size="42" font-weight="600">肚餓信號</text>
  <text x="48" y="118" dy="8" fill="#d2e8e4" font-size="22">先安撫，後餵哺</text>
  <rect x="36" y="208" width="488" height="336" rx="20" fill="#ffffff" stroke="#dcd6cc" stroke-width="2"/>
  <rect x="556" y="208" width="488" height="336" rx="20" fill="#ffffff" stroke="#dcd6cc" stroke-width="2"/>
  <rect x="52" y="228" width="456" height="52" rx="12" fill="#246e56"/>
  <rect x="572" y="228" width="456" height="52" rx="12" fill="#9a302a"/>
  <text x="72" y="254" dy="9" fill="#ffffff" font-size="26" font-weight="600">早期（宜餵）</text>
  <text x="592" y="254" dy="9" fill="#ffffff" font-size="26" font-weight="600">較遲（先安撫）</text>
  <text x="72" y="316" dy="9" fill="#1c2a3a" font-size="24">• 轉頭覓食</text>
