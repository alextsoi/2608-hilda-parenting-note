<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" width="100%" role="img" xml:lang="zh-Hant-HK">
  <title>肚餓信號</title>
