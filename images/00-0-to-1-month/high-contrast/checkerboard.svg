  <rect x="200" y="200" width="200" height="200" fill="#000000"/>
  <rect x="600" y="200" width="200" height="200" fill="#000000"/>
  <rect x="0" y="400" width="200" height="200" fill="#000000"/>
  <rect x="400" y="400" width="200" height="200" fill="#000000"/>
  <rect x="200" y="600" width="200" height="200" fill="#000000"/>
