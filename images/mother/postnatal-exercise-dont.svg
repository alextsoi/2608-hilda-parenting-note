<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 824" width="100%" role="img" xml:lang="zh-Hant-HK">
  <title>產後運動：做同唔好做</title>
  <desc>衞生署家庭健康服務網頁文字摘要　·　唔構成醫療建議</desc>
  <style>text{font-family:"PingFang HK","Heiti TC","Noto Sans TC","Hiragino Sans CNS",sans-serif}</style>
  <rect width="1080" height="824" fill="#f7f4ee"/>
  <rect width="1080" height="168" fill="#0b5e60"/>
  <rect y="168" width="1080" height="8" fill="#e8a858"/>
  <text x="48" y="78" fill="#ffffff" font-size="42" font-weight="600">產後運動：做同唔好做</text>
  <text x="48" y="124" fill="#d2e8e4" font-size="22">量力、循序漸進</text>
  <rect x="36" y="208" width="488" height="520" rx="20" fill="#ffffff" stroke="#dcd6cc" stroke-width="2"/>
  <rect x="556" y="208" width="488" height="520" rx="20" fill="#ffffff" stroke="#dcd6cc" stroke-width="2"/>
  <rect x="52" y="228" width="456" height="52" rx="12" fill="#246e56"/>
  <rect x="572" y="228" width="456" height="52" rx="12" fill="#9a302a"/>
  <text x="72" y="262" fill="#ffffff" font-size="26" font-weight="600">可以</text>
  <text x="592" y="262" fill="#ffffff" font-size="26" font-weight="600">未適宜</text>
  <text x="56" y="312" fill="#1c2a3a" font-size="24">• 深層收腹同盆骨底</text>
  <text x="56" y="384" fill="#1c2a3a" font-size="24">• 腰背左右擺膝</text>
  <text x="56" y="456" fill="#1c2a3a" font-size="24">• 由步行 10 分鐘開始</text>
  <text x="56" y="528" fill="#1c2a3a" font-size="24">• 抱 BB 時收腹</text>
  <text x="576" y="312" fill="#1c2a3a" font-size="24">• 仰臥起坐</text>
  <text x="576" y="384" fill="#1c2a3a" font-size="24">• 仰臥抬腿</text>
  <text x="576" y="456" fill="#1c2a3a" font-size="24">• 抬頭時肚隆起仍加難</text>
  <text x="576" y="528" fill="#1c2a3a" font-size="24">• 手術產未問醫生就練</text>
  <rect y="760" width="1080" height="64" fill="#0b5e60"/>
  <text x="48" y="798" fill="#d2e8e4" font-size="18">衞生署家庭健康服務網頁文字摘要　·　唔構成醫療建議</text>
</svg>
