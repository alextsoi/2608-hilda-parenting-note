<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" role="img" xml:lang="zh-Hant-HK">
  <title>三至六歲發展</title>
  <desc>衞生署家庭健康服務網頁文字摘要　·　唔構成醫療建議</desc>
  <style>text{font-family:"PingFang HK","Heiti TC","Noto Sans TC","Hiragino Sans CNS",sans-serif}</style>
  <rect width="1080" height="720" fill="#f7f4ee"/>
  <rect width="1080" height="168" fill="#0b5e60"/>
  <rect y="168" width="1080" height="8" fill="#e8a858"/>
  <text x="48" y="70" dy="15" fill="#ffffff" font-size="42" font-weight="600">三至六歲發展</text>
  <text x="48" y="118" dy="8" fill="#d2e8e4" font-size="22">語言、社交、自理</text>
  <circle cx="66" cy="230" r="18" fill="#0b5e60"/>
  <text x="66" y="230" dy="8" fill="#ffffff" font-size="22" text-anchor="middle">1</text>
  <text x="104" y="230" dy="10" fill="#1c2a3a" font-size="28">句子更完整，開始講故事</text>
  <circle cx="66" cy="292" r="18" fill="#0b5e60"/>
  <text x="66" y="292" dy="8" fill="#ffffff" font-size="22" text-anchor="middle">2</text>
  <text x="104" y="292" dy="10" fill="#1c2a3a" font-size="28">學輪流、分享、處理衝突</text>
  <circle cx="66" cy="354" r="18" fill="#0b5e60"/>
  <text x="66" y="354" dy="8" fill="#ffffff" font-size="22" text-anchor="middle">3</text>
  <text x="104" y="354" dy="10" fill="#1c2a3a" font-size="28">自理：如廁、梳洗、穿簡單衫</text>
  <circle cx="66" cy="416" r="18" fill="#0b5e60"/>
  <text x="66" y="416" dy="8" fill="#ffffff" font-size="22" text-anchor="middle">4</text>
  <text x="104" y="416" dy="10" fill="#1c2a3a" font-size="28">持續唔明指令或無朋友互動：評估</text>
  <circle cx="66" cy="478" r="18" fill="#0b5e60"/>
  <text x="66" y="478" dy="8" fill="#ffffff" font-size="22" text-anchor="middle">5</text>
  <text x="104" y="478" dy="10" fill="#1c2a3a" font-size="28">玩仍然係主要學習方式</text>
  <rect y="656" width="1080" height="64" fill="#0b5e60"/>
  <text x="48" y="688" dy="6" fill="#d2e8e4" font-size="18">衞生署家庭健康服務網頁文字摘要　·　唔構成醫療建議</text>
</svg>
